{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow">
      <div class="card-body">
        <h3 class="card-title text-center">Créer un compte</h3>
        <form method="POST">
          <div class="mb-3"><label>Nom complet</label><input type="text" name="nom" class="form-control" required></div>
          <div class="mb-3"><label>Email</label><input type="email" name="email" class="form-control" required></div>
          <div class="mb-3"><label>Mot de passe</label><input type="password" name="mdp" class="form-control" required></div>
          <button type="submit" class="btn btn-primary w-100">S'inscrire</button>
        </form>
        <p class="text-center mt-3">Déjà un compte? <a href="/login">Se connecter</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
