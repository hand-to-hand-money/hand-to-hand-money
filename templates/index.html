<!DOCTYPE html>
<html>
<head>
    <title>Hand-to-Hand Money</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 20px auto; padding: 20px; }
        form { background: #f0f0f0; padding: 15px; border-radius: 8px; }
        input { padding: 8px; margin: 5px; }
        button { padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 5px; }
        .depense { border-bottom: 1px solid #ccc; padding: 10px 0; }
        .total { font-size: 20px; font-weight: bold; color: green; }
    </style>
</head>
<body>
    <h1>Gestion des Dépenses</h1>
   
    <form method="POST">
        <input type="text" name="nom" placeholder="Nom de la dépense" required>
        <input type="number" step="0.01" name="montant" placeholder="Montant" required>
        <button type="submit">Ajouter</button>
    </form>

    <h2>Total: <span class="total">{{ total }} Gdes</span></h2>

    <h3>Historique:</h3>
    {% for d in depenses %}
    <div class="depense">
        <b>{{ d.nom }}</b> - {{ d.montant }} Gdes - <i>{{ d.date }}</i>
    </div>
    {% endfor %}
</body>
</html>
