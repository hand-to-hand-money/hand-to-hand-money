<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Connexion</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
<div class="bg-white p-8 rounded-lg shadow-md w-96">
<h2 class="text-2xl font-bold text-center mb-6 text-blue-600">Hand to Hand</h2>
{% with messages = get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="p-2 mb-3 rounded bg-red-100 text-red-700">{{m}}</div>{% endfor %}{% endwith %}
<form method="POST" class="space-y-4">
<input type="text" name="username" placeholder="Nom d'utilisateur" required class="w-full p-3 border rounded">
<input type="password" name="password" placeholder="Mot de passe" required class="w-full p-3 border rounded">
<button type="submit" class="w-full bg-blue-600 text-white py-3 rounded font-bold">Se connecter</button>
</form>
<p class="text-center mt-4">Pas de compte? <a href="{{ url_for('register') }}" class="text-blue-600">S'inscrire</a></p>
</div></body></html>
