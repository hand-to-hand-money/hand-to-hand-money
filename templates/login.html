<!DOCTYPE html>
<html lang="fr"><head><title>Login</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
<div class="bg-white p-8 rounded shadow-md w-96">
    <h1 class="text-2xl font-bold mb-4">Connexion QPP</h1>
    {% with messages = get_flashed_messages() %}{% if messages %}<p class="text-red-500">{{ messages[0] }}</p>{% endif %}{% endwith %}
    <form method="POST">
        <input name="username" placeholder="Username" class="w-full p-2 border rounded mb-2" required>
        <input name="password" type="password" placeholder="Password" class="w-full p-2 border rounded mb-4" required>
        <button class="w-full bg-blue-500 text-white p-2 rounded">Se connecter</button>
    </form>
    <p class="text-sm mt-4">Admin: admin / admin123</p>
</div></body></html>
