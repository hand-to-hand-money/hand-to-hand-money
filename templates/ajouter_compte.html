<!DOCTYPE html>
<html lang="fr"><head><title>Ajouter Compte</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
<div class="bg-white p-8 rounded shadow-md w-96">
    <h1 class="text-2xl font-bold mb-4">Nouveau Compte</h1>
    <form method="POST">
        <input name="nom" placeholder="Nom du compte: Ex: Orange Money" class="w-full p-2 border rounded mb-4" required>
        <button class="w-full bg-green-500 text-white p-2 rounded">Créer</button>
    </form>
</div></body></html>
