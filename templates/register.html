<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
<div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">
    <h2 class="text-2xl font-bold text-center mb-2 text-blue-600">Hand to Hand</h2>
    <p class="text-center text-gray-500 mb-6">Créer votre compte</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for c,m in messages %}
        <div class="p-3 mb-4 rounded {% if c=='success' %}bg-green-100 text-green-700{% else %}bg-red-100 text-red-700{% endif %} text-sm">
            {{m}}
        </div>
        {% endfor %}
    {% endwith %}

    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-semibold mb-1">Nom d'utilisateur</label>
            <input type="text" name="username" placeholder="Ex: jean123" required
                   class="w-full p-3 border-gray-300 rounded focus:border-blue-500 focus:outline-none">
        </div>
        <div>
            <label class="block text-sm font-semibold mb-1">Mot de passe</label>
            <input type="password" name="password" placeholder="Min 6 caractères" required
                   class="w-full p-3 border border-gray-300 rounded focus:border-blue-500 focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded font-bold hover:bg-blue-700">
            S'inscrire
        </button>
    </form>
    <p class="text-center mt-6 text-sm">
        Déjà un compte? <a href="{{ url_for('login') }}" class="text-blue-600 font-semibold">Se connecter</a>
    </p>
</div>
</body>
</html>
