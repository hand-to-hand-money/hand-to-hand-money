<!DOCTYPE html>
<html><head><title>Inscription</title>
<style>body{font-family:Arial; max-width:400px; margin:50px auto; padding:20px; border:1px solid #ccc;}</style>
</head><body>
<h2>Inscription</h2>
{% with messages = get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<p class="{{c}}">{{m}}</p>{% endfor %}{% endwith %}
<form method="POST">
    <input type="text" name="username" placeholder="Nom d'utilisateur" required style="width:100%; padding:8px; margin:5px 0;">
    <input type="password" name="password" placeholder="Mot de passe" required style="width:100%; padding:8px; margin:5px 0;">
    <button type="submit" style="width:100%; padding:10px;">Créer le compte</button>
</form>
<p>Déjà un compte? <a href="{{ url_for('login') }}">Se connecter</a></p>
</body></html>
