<!DOCTYPE html>
<html lang="fr">
<head><title>Accueil</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold">Bonjour {{ current_user.username }}</h1>
        <p class="text-2xl mt-2">Solde Total: {{ "%.2f"|format(solde_total) }} FCFA</p>
       
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
        {% for compte in comptes %}
            <div class="bg-white p-4 rounded-lg shadow">
                <h2 class="font-bold text-lg">{{ compte.nom }}</h2>
                <p class="text-xl">Solde: {{ "%.2f"|format(calculer_solde(compte.id)) }} FCFA</p>
            </div>
        {% else %}
            <p>Aucun compte. Va dans "Ajouter Compte"</p>
        {% endfor %}
        </div>
    </div>
</body>
</html>
