<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Accueil - Hand to Hand</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <h1 class="text-3xl font-bold mb-4">Bienvenue {{ current_user.username }}</h1>
    <p class="text-xl">Solde Total: {{ solde_total }} FCFA</p>
    <hr class="my-4">
    {% for compte in comptes %}
    <div class="bg-white p-4 rounded shadow mb-2">
        <h2 class="font-bold">{{ compte.nom }}</h2>
        <p>Solde: {{ calculer_solde(compte.id) }} FCFA</p>
    </div>
    {% endfor %}
</body>
</html>
