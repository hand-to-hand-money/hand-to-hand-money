<!DOCTYPE html>
<html>
<head>
    <title>Accueil</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <h1 class="text-2xl font-bold">Accueil</h1>
        <p>Solde Total: {{ solde_total }} FCFA</p>
        {% for compte in comptes %}
            <div class="bg-white p-4 rounded shadow mt-2">
                <p>{{ compte.nom }} - {{ calculer_solde(compte.id) }} FCFA</p>
            </div>
        {% endfor %}
    </div>
</body>
</html>
